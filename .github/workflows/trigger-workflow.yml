name: Trigger agent manager

on:
  push:
    branches:
      - 'dev'
  workflow_call:
    inputs:
      event_type:
        description: 'Event type to send to the agent manager'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Trigger agent manager
      run: |
        repo_owner="WriterInternal"
        repo_name="be.agent-manager"
        event_type="${{ github.event.inputs.event_type || 'framework_updated' }}"
        commit_sha=${{ github.sha }}

        echo "Triggering agent manager with event_type=$event_type"

        curl -L \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.AGENT_MANAGER_PAT }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/$repo_owner/$repo_name/dispatches \
          -d "{\"event_type\": \"$event_type\", \"client_payload\": {\"commit_sha\": \"$commit_sha\"}}"
