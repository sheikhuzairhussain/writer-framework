name: publish

on:
    push:
        branches:
          - 'dev'
    workflow_dispatch:
        inputs:
            commit_sha:
                description: 'Commit SHA to publish'
                required: true
            version:
                description: 'Version to publish (optional, overrides calculated version)'
                required: false

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - uses: actions/checkout@v4
              with:
                ref: ${{ github.event.inputs.commit_sha || github.ref_name }}

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                cache: 'poetry'

            - name: Bump RC number from PyPI
              id: bump_rc
              run: |
                pip install requests packaging
                export PACKAGE="writer"
                export VERSION_BASE="${{ needs.pr.outputs.version }}"

                python - <<'EOF'
                import requests, re, packaging.version, os, sys

                pkg = os.getenv("PACKAGE")
                base_version = os.getenv("VERSION_BASE")

                resp = requests.get(f"https://pypi.org/pypi/{pkg}/json", timeout=10)
                resp.raise_for_status()
                data = resp.json()
                releases = list(data["releases"].keys())

                # Filter for RCs of this base version
                rc_versions = [
                    v for v in releases
                    if v.startswith(base_version) and "rc" in v
                ]

                if rc_versions:
                    latest = sorted(rc_versions, key=packaging.version.parse)[-1]
                    match = re.search(r"rc(\d+)", latest)
                    next_rc_num = int(match.group(1)) + 1 if match else 1
                else:
                    next_rc_num = 1

                final_version = f"{base_version}rc{next_rc_num}"

                print(f"Next RC version: {final_version}")
                output_path = os.environ["GITHUB_OUTPUT"]
                with open(output_path, "a", encoding="utf-8") as fh:
                    fh.write(f"release_candidate={next_rc_num}\n")
                    fh.write(f"final_version={final_version}\n")
                EOF

            - name: Show calculated version
              run: echo "Calculated version is ${{ steps.bump_rc.outputs.final_version }}"

            - name: Install poetry
              run: pipx install poetry

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                node-version: "22.x"
                cache: npm

            - name: Update version before publishing
              run: poetry version ${{ steps.bump_rc.outputs.version || github.event.inputs.version }}

            - name: install python3 environment
              run: poetry install --with build

            - name: install ci dependencies and generate code
              run: WRITER_FRAMEWORK_VERSION=${{ steps.bump_rc.outputs.version || github.event.inputs.version }} poetry run alfred install.ci

            - name: publish on pypi
              run: WRITER_FRAMEWORK_VERSION=${{ steps.bump_rc.outputs.version || github.event.inputs.version }} poetry run alfred publish.pypi
              env:
                  PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}

            - name: Trigger Agent Manager workflow
              uses: ./.github/workflows/trigger-workflow.yml
              with:
                event_type: framework_published
